{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login-wrap">
  <h1 style="margin-bottom:14px">Development Platform</h1>
  <div class="panel">
    {% if error %}<div class="errors">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field" style="margin-bottom:12px"><label for="email">Email</label><input id="email" type="email" name="email" required autofocus autocomplete="username"></div>
      <div class="field" style="margin-bottom:16px"><label for="password">Password</label><input id="password" type="password" name="password" required autocomplete="current-password"></div>
      <button class="btn" style="width:100%">Sign in</button>
    </form>
  </div>
  <p class="muted small">Accounts are created by your team's admin.</p>
</div>
{% endblock %}
