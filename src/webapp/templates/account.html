{% extends "base.html" %}
{% from "macros.html" import csrf_field with context %}
{% block title %}Account{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Your account</h1><div class="muted">{{ user.email }} · {{ user.role }}</div></div></div>
<div class="panel" style="max-width:520px">
  <h2>Change password</h2>
  {% if error %}<div class="errors">{{ error }}</div>{% endif %}
  <form method="post" action="/account/password">
    {{ csrf_field() }}
    <div class="field" style="margin-bottom:10px"><label>Current password</label><input type="password" name="current" required autocomplete="current-password"></div>
    <div class="field" style="margin-bottom:14px"><label>New password (at least 10 characters)</label><input type="password" name="new" required minlength="10" autocomplete="new-password"></div>
    <button class="btn">Change password</button>
  </form>
</div>
{% endblock %}
