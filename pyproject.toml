[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feasibility"
version = "0.1.0"
description = "Monthly real-estate feasibility engine"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2.6"]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "reportlab>=4.0",
    "python-pptx>=0.6.23",
    "anthropic>=0.70",
]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webapp = ["templates/*.html", "static/*", "sample_study.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
